name: Build and Deploy Icons

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------
      #   Checkout
      # ----------------------------
      - name: Checkout
        uses: actions/checkout@v5

      # ----------------------------
      #   Setup Python（生成 manifest/index）
      # ----------------------------
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      # ----------------------------
      #   Cache resvg
      # ----------------------------
      - name: Cache cargo bin
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/resvg
          key: ${{ runner.os }}-resvg
          restore-keys: |
            ${{ runner.os }}-resvg-

      - name: Install resvg if missing
        run: |
          if [ ! -f ~/.cargo/bin/resvg ]; then
            cargo install resvg --locked
          fi

      # ----------------------------
      #   Build assets
      # ----------------------------
      - name: Build assets
        run: |
          set -e

          mkdir -p out/packages
          mkdir -p out/global

          echo "===== Processing packages ====="
          if [ -d packages ]; then
            for dir in packages/*; do
              [ -d "$dir" ] || continue
              pkg=$(basename "$dir")
              outdir="out/packages/$pkg"
              mkdir -p "$outdir"

              echo ">> Package: $pkg"

              # 复制已有 PNG
              for file in "$dir"/*.png; do
                [ -f "$file" ] || continue
                cp "$file" "$outdir/"
              done

              # SVG → PNG
              for file in "$dir"/*.svg; do
                [ -f "$file" ] || continue
                name=$(basename "$file" .svg)
                echo "Convert $file → $name.png"
                ~/.cargo/bin/resvg "$file" "$outdir/$name.png"
              done
            done
          fi

          echo "===== Processing global ====="
          if [ -d global ]; then
            for f in global/*; do
              [ -e "$f" ] || continue
              if [ -d "$f" ]; then
                # 文件夹 -> out/global/ 文件夹
                outdir="out/global/$(basename "$f")"
                mkdir -p "$outdir"

                echo ">> Package: $outdir"

                # 复制 PNG
                for file in "$f"/*.png; do
                  [ -f "$file" ] || continue
                  cp "$file" "$outdir/"
                done

                # SVG -> PNG
                for file in "$f"/*.svg; do
                  [ -f "$file" ] || continue
                  name=$(basename "$file" .svg)
                  echo "Convert $file → $name.png"
                  ~/.cargo/bin/resvg "$file" "$outdir/$name.png"
                done
              else
                # 保留原来的散文件
                cp "$f" out/global/
              fi
            done
          fi

      # ----------------------------
      #   Generate index.json
      # ----------------------------
      - name: Generate index
        run: python3 scripts/gen_index.py out

      - name: Generate HTML preview
        run: python3 scripts/gen_html.py out

      # ----------------------------
      #   Add .nojekyll
      # ----------------------------
      - name: Add .nojekyll
        run: touch out/.nojekyll

      # ----------------------------
      #   Deploy to gh-pages
      # ----------------------------
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: ./out
          token: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------
      #   Deploy to Cloudflare Pages
      # ----------------------------
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: "colorosicons"
          directory: "./out"
          branch: "main"
