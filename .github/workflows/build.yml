name: Build and Deploy Icons

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------
      # 1️⃣ Checkout
      # ----------------------------
      - name: Checkout
        uses: actions/checkout@v5

      # ----------------------------
      # 2️⃣ Setup Python（生成 manifest/index）
      # ----------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # ----------------------------
      # 3️⃣ Cache resvg
      # ----------------------------
      - name: Cache cargo bin
        uses: actions/cache@v3
        with:
          path: ~/.cargo/bin/resvg
          key: ${{ runner.os }}-resvg
          restore-keys: |
            ${{ runner.os }}-resvg-

      - name: Install resvg if missing
        run: |
          if [ ! -f ~/.cargo/bin/resvg ]; then
            cargo install resvg --locked
          fi

      # ----------------------------
      # 4️⃣ Build assets
      # ----------------------------
      - name: Build assets
        run: |
          set -e

          mkdir -p out/packages
          mkdir -p out/global

          echo "===== Processing packages ====="
          if [ -d packages ]; then
            for dir in packages/*; do
              [ -d "$dir" ] || continue
              pkg=$(basename "$dir")
              outdir="out/packages/$pkg"
              mkdir -p "$outdir"

              echo ">> Package: $pkg"

              # 复制已有 PNG
              for file in "$dir"/*.png; do
                [ -f "$file" ] || continue
                cp "$file" "$outdir/"
              done

              # SVG → PNG
              for file in "$dir"/*.svg; do
                [ -f "$file" ] || continue
                name=$(basename "$file" .svg)
                echo "Convert $file → $name.png"
                ~/.cargo/bin/resvg "$file" "$outdir/$name.png"
              done
            done
          fi

          echo "===== Processing global ====="
          if [ -d global ]; then
            for f in global/*; do
              [ -f "$f" ] || continue
              cp "$f" out/global/
            done
          fi

      # ----------------------------
      # 5️⃣ Generate manifests
      # ----------------------------
      - name: Generate manifests
        run: python3 scripts/gen_manifest.py out/packages

      # ----------------------------
      # 6️⃣ Generate index.json
      # ----------------------------
      - name: Generate index
        run: python3 scripts/gen_index.py out

      - name: Generate HTML preview
        run: python3 scripts/gen_html.py out

      # ----------------------------
      # 7️⃣ Add .nojekyll
      # ----------------------------
      - name: Add .nojekyll
        run: touch out/.nojekyll

      # ----------------------------
      # 8️⃣ Deploy to gh-pages
      # ----------------------------
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./out
